<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WattWise — Updating</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, sans-serif; color: #f4f8ec;
      background: radial-gradient(900px 600px at 80% -10%, #2b5c1d, transparent 60%), #08170b;
    }
    .card {
      max-width: 520px; padding: 36px; text-align: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(163,237,42,.2);
      border-radius: 24px;
    }
    h1 { font-size: 32px; margin: 14px 0 8px; }
    p { color: #a9bfa2; line-height: 1.6; margin: 0; }
    .bar {
      height: 6px; margin-top: 24px; border-radius: 99px;
      background: rgba(255,255,255,.08); overflow: hidden;
    }
    .bar span {
      display: block; width: 40%; height: 100%; background: #a3ed2a;
      border-radius: 99px; animation: slide 1.4s ease-in-out infinite alternate;
    }
    @keyframes slide { to { transform: translateX(150%); } }
  </style>
</head>
<body>
  <main class="card">
    <div style="font-size:42px">⚡</div>
    <h1>WattWise is getting an update.</h1>
    <p>We’re improving the dashboard and will be back shortly. Thanks for your patience.</p>
    <div class="bar"><span></span></div>
  </main>
</body>
</html>
